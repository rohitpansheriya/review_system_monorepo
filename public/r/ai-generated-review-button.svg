<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <!-- Background Button Gradient matching Review Page -->
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Drop Shadow Filter for Standee Print & Digital Displays -->
    <filter id="buttonShadow" x="-10%" y="-20%" width="120%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Button Container / Pill Shape -->
  <g filter="url(#buttonShadow)">
    <rect 
      x="10" 
      y="12" 
      width="440" 
      height="86" 
      rx="43" 
      fill="url(#btnGradient)" 
      stroke="url(#borderGradient)" 
      stroke-width="3" 
    />
  </g>

  <!-- Sparkle Icons (✨) -->
  <g transform="translate(48, 30)">
    <!-- Primary Big Sparkle Star -->
    <path 
      d="M 24 0 Q 24 16 40 24 Q 24 32 24 48 Q 24 32 8 24 Q 24 16 24 0 Z" 
      fill="#ffffff"
    />
    <!-- Secondary Small Sparkle Star (Top Right) -->
    <path 
      d="M 44 4 Q 44 10 50 13 Q 44 16 44 22 Q 44 16 38 13 Q 44 10 44 4 Z" 
      fill="#fde047"
    />
    <!-- Tertiary Mini Sparkle Star (Bottom Left) -->
    <path 
      d="M 6 32 Q 6 36 10 38 Q 6 40 6 44 Q 6 40 2 38 Q 6 36 6 32 Z" 
      fill="#ffffff" 
      opacity="0.9"
    />
  </g>

  <!-- Button Label Typography -->
  <text 
    x="122" 
    y="63" 
    fill="#ffffff" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="28" 
    font-weight="700" 
    letter-spacing="0.4"
  >
    AI Generated Review
  </text>
</svg>
