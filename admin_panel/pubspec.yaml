name: admin_panel
description: Review System — Employee, Owner & Admin Panel (Flutter Web)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.5
  cloud_functions: ^5.4.3

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI utilities
  image_picker_web: ^4.0.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  uuid: ^4.6.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
